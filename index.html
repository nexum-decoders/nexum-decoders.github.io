<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexum Decoders</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .animation { margin-bottom: 37.5px; }

    body {
      background-color: #0a0a0f;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .page-center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Single scaling knob: both h1 and subtitle are em-relative to this */
    .brand-text {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      font-size: clamp(var(--brand-size-min), 6vw, var(--brand-size-max));
      visibility: hidden;
    }

    h1 {
      color: var(--title-color, #87ceeb);
      font-family: 'Georgia', serif;
      font-size: 1em;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.12em;
    }

    .subtitle {
      --letter-gap: 0em;
      color: var(--subtitle-color, #808080);
      font-family: 'Georgia', serif;
      /* 0.85rem / 5rem = 0.17 — keeps same visual ratio as the design */
      font-size: 0.17em;
      font-weight: 300;
      margin-top: 0.6em;
      display: flex;
      gap: var(--letter-gap);
    }

    .subtitle .word-gap { width: calc(var(--letter-gap) * 2); }

    h1 .tm {
      font-size: 0.35em;
      vertical-align: super;
      font-style: italic;
    }

    .tagline {
      color: #b3b3b3;
      font-family: 'Georgia', serif;
      font-size: 16px;
      font-style: italic;
      font-weight: 300;
      margin-top: 30px;
      text-align: center;
    }

    .chip2agent-logo {
      display: block;
      margin: 18px auto 0;
      width: 130px;
      filter: none;
      opacity: 0.8;
    }

    footer {
      position: fixed;
      bottom: 20px;
      color: #b3b3b3;
      font-family: 'Georgia', serif;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.08em;
    }

  </style>
</head>
<body>

  <script>
    // ─── CONFIGURATION ──────────────────────────────────────────
    const CONFIG = {
      titleColor:    '#1E90FF',
      subtitleColor: '#A0A0A0',
      animColorLeft:  '#1E90FF',
      brandSizeMin:  '2.5rem',   // smallest the brand text will shrink to
      brandSizeMax:  '4.5rem',   // largest it will grow to
    };
    // ────────────────────────────────────────────────────────────

    const R = document.documentElement.style;
    R.setProperty('--title-color',    CONFIG.titleColor);
    R.setProperty('--subtitle-color', CONFIG.subtitleColor);
    R.setProperty('--anim-color-left',  CONFIG.animColorLeft);
R.setProperty('--brand-size-min',   CONFIG.brandSizeMin);
    R.setProperty('--brand-size-max',   CONFIG.brandSizeMax);
  </script>

  <!-- swap animation by changing this src -->
  <script src="animations/cardioit_03.js?v=2"></script>
  <script>document.head.insertAdjacentHTML('beforeend', window.ANIM_CSS);</script>
  <div class="page-center">
  <div class="animation anim-v2"></div>
  <script>document.querySelector('.animation').innerHTML = window.ANIM_SVG;</script>

  <div class="brand">
    <div class="brand-text">
      <h1>Nexum Decoders<span class="tm">&#8482;</span></h1>
      <p class="subtitle"><span>A</span><span>G</span><span>E</span><span>N</span><span>T</span><span>I</span><span>C</span><span class="word-gap"></span><span>A</span><span>U</span><span>T</span><span>O</span><span>M</span><span>A</span><span>T</span><span>I</span><span>O</span><span>N</span></p>
    </div>
    <p class="tagline">...building new operating systems</p>
    <img src="pics/chip2agent-black.svg" alt="chip2agent" class="chip2agent-logo">
  </div>
  </div>

  <footer>© 2026 NexDec LLC</footer>

  <script>
    // Runs once after fonts load. Sets letter-spacing and gap in `em` so they
    // scale proportionally with .brand-text font-size at all viewport widths.
    function alignText() {
      const h1  = document.querySelector('h1');
      const sub = document.querySelector('.subtitle');

      h1.style.letterSpacing = '0';
      sub.style.setProperty('--letter-gap', '0em');
      sub.style.alignSelf = 'flex-start';

      const h1BaseWidth = h1.getBoundingClientRect().width;
      const subNatWidth = sub.getBoundingClientRect().width;
      sub.style.alignSelf = '';

      const h1FontPx  = parseFloat(getComputedStyle(h1).fontSize);
      const subFontPx = parseFloat(getComputedStyle(sub).fontSize);
      const units     = sub.querySelectorAll('span').length + 1;
      const gapPx     = Math.ceil((h1BaseWidth - subNatWidth) / units);
      const targetWidth = subNatWidth + gapPx * units;
      const h1Chars   = h1.textContent.trim().length;
      const lsPx      = (targetWidth - h1BaseWidth) / h1Chars;

      // Store as em so they scale with the parent font-size on resize
      h1.style.letterSpacing = (lsPx / h1FontPx) + 'em';
      sub.style.setProperty('--letter-gap', (gapPx / subFontPx) + 'em');

      // Correction pass for Safari trailing letter-spacing measurement
      const diff = sub.getBoundingClientRect().width - h1.getBoundingClientRect().width;
      if (Math.abs(diff) > 0.5) {
        const currentLsEm = parseFloat(getComputedStyle(h1).letterSpacing) / h1FontPx;
        h1.style.letterSpacing = (currentLsEm + diff / h1Chars / h1FontPx) + 'em';
      }

      document.querySelector('.brand-text').style.visibility = 'visible';
      centerH1();
    }

    function centerH1() {
      const pc = document.querySelector('.page-center');
      pc.style.transform = '';
      const h1 = document.querySelector('h1');
      const h1CenterY = h1.getBoundingClientRect().top + h1.getBoundingClientRect().height / 2;
      const offset = window.innerHeight / 2 - h1CenterY;
      pc.style.transform = `translateY(${offset}px)`;
    }

    document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(alignText)));

    let resizeTimer;
    const ro = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => requestAnimationFrame(alignText), 50);
    });
    ro.observe(document.documentElement);
  </script>

</body>
</html>
