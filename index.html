<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexum Decoders</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .gears { margin-bottom: 50px; }

    body {
      background-color: #0a0a0f;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
    }

    h1 {
      color: var(--title-color, #87ceeb);
      font-family: 'Georgia', serif;
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.12em;
    }

    .subtitle {
      --letter-gap: 0px;
      color: var(--subtitle-color, #808080);
      font-family: 'Georgia', serif;
      font-size: clamp(0.55rem, 1.1vw, 0.85rem);
      font-weight: 300;
      margin-top: 10px;
      display: flex;
      gap: var(--letter-gap);
    }

    .subtitle .word-gap { width: calc(var(--letter-gap) * 2); }

    h1 .tm {
      font-size: 0.35em;
      vertical-align: super;
      font-style: italic;
    }

    .tagline {
      color: #b3b3b3;
      font-family: 'Georgia', serif;
      font-size: 16px;
      font-style: italic;
      font-weight: 300;
      margin-top: 50px;
      text-align: center;
    }

    footer {
      position: fixed;
      bottom: 20px;
      color: #b3b3b3;
      font-family: 'Georgia', serif;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.08em;
    }

  </style>
</head>
<body>

  <script>
    // ─── CONFIGURATION ──────────────────────────────────────────
    const CONFIG = {
      titleColor:    '#1E90FF',
      subtitleColor: '#808080',
      gearV2Left:    '#1E90FF',
      gearV2Right:   '#1E90FF',
    };
    // ────────────────────────────────────────────────────────────

    const R = document.documentElement.style;
    R.setProperty('--title-color',    CONFIG.titleColor);
    R.setProperty('--subtitle-color', CONFIG.subtitleColor);
    R.setProperty('--gear-v2-left',   CONFIG.gearV2Left);
    R.setProperty('--gear-v2-right',  CONFIG.gearV2Right);
  </script>

  <!-- swap gear design by changing this src -->
  <script src="animations/cardioit_03.js"></script>
  <script>document.head.insertAdjacentHTML('beforeend', window.GEAR_CSS);</script>
  <div class="gears gear-v2"></div>
  <script>document.querySelector('.gears').innerHTML = window.GEAR_SVG;</script>

  <div class="brand">
    <h1>Nexum Decoders<span class="tm">&#8482;</span></h1>
    <p class="subtitle"><span>A</span><span>G</span><span>E</span><span>N</span><span>T</span><span>I</span><span>C</span><span class="word-gap"></span><span>A</span><span>U</span><span>T</span><span>O</span><span>M</span><span>A</span><span>T</span><span>I</span><span>O</span><span>N</span></p>
    <p class="tagline">...building new operating systems, soon...</p>
  </div>

  <footer>© 2026 NexDec LLC</footer>

  <script>
    function alignText() {
      const h1  = document.querySelector('h1');
      const sub = document.querySelector('.subtitle');

      h1.style.letterSpacing = '0';
      sub.style.setProperty('--letter-gap', '0px');
      sub.style.alignSelf = 'flex-start';

      const h1BaseWidth = h1.getBoundingClientRect().width;
      const subNatWidth = sub.getBoundingClientRect().width;
      sub.style.alignSelf = '';

      const units       = sub.querySelectorAll('span').length + 1;
      const gap         = Math.ceil((h1BaseWidth - subNatWidth) / units);
      const targetWidth = subNatWidth + gap * units;
      const h1Chars     = h1.textContent.trim().length;

      h1.style.letterSpacing = ((targetWidth - h1BaseWidth) / h1Chars) + 'px';
      sub.style.setProperty('--letter-gap', gap + 'px');
    }

    document.fonts.ready.then(alignText);
    window.addEventListener('resize', alignText);
  </script>

</body>
</html>
